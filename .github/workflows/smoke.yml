name: skill-smoke

# Smoke-test the skill scripts against a fresh laravel new (React).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, sqlite3, bcmath, intl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Laravel installer
        run: composer global require laravel/installer --no-interaction

      - name: Scaffold + Essentials + tooling (React)
        run: |
          set -euo pipefail
          export PATH="${HOME}/.config/composer/vendor/bin:${HOME}/.composer/vendor/bin:${PATH}"
          chmod +x skills/laravel-new/scripts/*
          SKILL="$PWD/skills/laravel-new"
          WORK="$RUNNER_TEMP/skill-smoke"
          mkdir -p "$WORK"
          "$SKILL/scripts/scaffold-app" smoke-react --kit react --database sqlite --phpunit --parent "$WORK"
          APP="$WORK/smoke-react"
          cd "$APP"
          git init -b main
          git config user.email "smoke@example.com"
          git config user.name "smoke"
          git add -A
          git commit -m "Scaffold Laravel application (official react starter kit)"
          "$SKILL/scripts/apply-essentials" --dir "$APP"
          test -f app/Providers/EssentialsServiceProvider.php
          grep -q EssentialsServiceProvider bootstrap/providers.php
          grep -q "Model::shouldBeStrict" app/Providers/EssentialsServiceProvider.php
          git add -A
          git commit -m "Apply sensible Laravel defaults (strict models, immutable dates, make:action, Pint)"
          "$SKILL/scripts/setup-tooling" --dir "$APP" --agents cursor
          git add -A
          git diff --cached --quiet || git commit -m "Install Boost, Wayfinder, vite-plus/vp JS tooling, and project tooling"
          php artisan test
          vendor/bin/pint --parallel --test
          vendor/bin/phpstan analyse
          npm run format:check
          npm run lint
          npm run types
          npm run test:js
          npm run build
          # vite-plus path: scripts call vp; no direct ox*/Jest deps or separate ox configs
          grep -q '"format": "vp fmt"' package.json
          grep -q '"format:check": "vp fmt --check"' package.json
          grep -q '"lint": "vp lint"' package.json
          grep -q '"types": "vp check --no-fmt --no-lint"' package.json
          grep -q '"test:js": "LARAVEL_BYPASS_ENV_CHECK=1 vp test"' package.json
          ! grep -E '"oxfmt"|"oxlint"|"oxlint-tsgolint"|"jest"|@swc/jest|jest-environment-jsdom|"@types/jest"' package.json
          test ! -e .oxfmtrc.json
          test ! -e .oxlintrc.json
          test ! -e jest.config.cjs
          test ! -e jest.config.js
          test ! -e resources/js/jest.setup.ts
          grep -q 'typeCheck: true' vite.config.ts
          test -f package-lock.json
          # Generated app CI workflow (check/dry-run only)
          test -f .github/workflows/ci.yml
          grep -q 'pint --parallel --test' .github/workflows/ci.yml
          grep -q 'format:check' .github/workflows/ci.yml
          grep -q 'test:js' .github/workflows/ci.yml
          grep -q 'phpstan analyse' .github/workflows/ci.yml
          ! grep -E 'pint --parallel[[:space:]]*$|pint --parallel --dirty|oxfmt[[:space:]]*$|vp fmt[[:space:]]*$|check:fix|--fix' .github/workflows/ci.yml
          # Default path is npm (lockfile); scripts must not require --legacy-peer-deps
          ! grep -R -- '--legacy-peer-deps' "$SKILL/scripts"
          php artisan tinker --execute '
          $id = App\Models\User::factory()->create()->id;
          $u = App\Models\User::query()->findOrFail($id);
          try { $u->totally_missing_attr; echo "strict FAIL\n"; exit(1); }
          catch (Throwable $e) { echo "strict OK\n"; }
          echo get_class(Illuminate\Support\Facades\Date::now()), "\n";
          '
          test "$(git rev-list --count HEAD)" -ge 3
