name: upstream-sync

# Scheduled + on-demand: keep patches applying to the official React starter kit,
# verify lint/tests/build, and regenerate the materialized `kit` branch for
# `laravel new --using=https://github.com/arcana-softworks/laravel-react#kit`.

on:
  schedule:
    - cron: '15 6 * * 1-5'
  push:
    # Only main — kit-branch pushes from materialize must not re-trigger this workflow.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout kit repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist credentials so bin/kit materialize --push can force-push kit
          # with the workflow GITHUB_TOKEN (contents: write).
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, sqlite3, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check upstream movement
        id: upstreams
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x bin/kit
          if bin/kit check-upstreams; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream starter kit and/or Essentials have moved past the pinned refs in versions.json"
          fi

      - name: Fetch pinned starter kit and apply patches
        run: |
          set -euo pipefail
          chmod +x bin/kit
          bin/kit fetch
          bin/kit apply --dir .cache/starter

      - name: Also try applying against upstream main (early warning)
        id: sync_main
        continue-on-error: true
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote https://github.com/laravel/react-starter-kit.git refs/heads/main | awk '{print $1}')
          rm -rf .cache/starter-main
          git clone --depth 1 https://github.com/laravel/react-starter-kit.git .cache/starter-main
          git -C .cache/starter-main fetch --depth 1 origin "$MAIN_SHA"
          git -C .cache/starter-main checkout --force "$MAIN_SHA"
          if bin/kit apply --dir .cache/starter-main; then
            echo "main_apply=ok" >> "$GITHUB_OUTPUT"
          else
            echo "main_apply=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Patches failed to apply cleanly against laravel/react-starter-kit main (${MAIN_SHA}). Regenerate patches."
            exit 1
          fi

      - name: Install PHP dependencies
        working-directory: .cache/starter
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Discover packages and prepare app
        working-directory: .cache/starter
        run: |
          set -euo pipefail
          cp -n .env.example .env || true
          php artisan package:discover --ansi
          php artisan key:generate --force --ansi
          mkdir -p database
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force --ansi

      - name: Install JS dependencies and build
        working-directory: .cache/starter
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Pint
        working-directory: .cache/starter
        run: vendor/bin/pint --parallel --test

      - name: PHPStan
        working-directory: .cache/starter
        run: vendor/bin/phpstan analyse

      - name: PHPUnit
        working-directory: .cache/starter
        run: php artisan test

      - name: Materialize and push kit branch
        # Never on PRs; only on main (push / schedule / dispatch). kit pushes do not match `on.push.branches: [main]`.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Regenerates the orphan `kit` branch from patches (never hand-edited).
          # Required for: laravel new my-app --using=https://github.com/arcana-softworks/laravel-react#kit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bin/kit materialize --push

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          USING=$(python3 -c 'import json;d=json.load(open("versions.json"));print(d["kit"].get("using_url","https://github.com/arcana-softworks/laravel-react#kit"))')
          BR=$(python3 -c 'import json;print(json.load(open("versions.json"))["kit"]["branch"])')
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinned starter: \`$(python3 -c 'import json;print(json.load(open("versions.json"))["starter_kit"]["ref"])')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinned essentials: \`$(python3 -c 'import json;d=json.load(open("versions.json"));print(d["essentials"]["ref"], d["essentials"]["commit"])')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstreams moved: \`${{ steps.upstreams.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply on upstream main: \`${{ steps.sync_main.outputs.main_apply }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`laravel new --using\`: \`${USING}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Materialized branch: \`${BR}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.sync_main.outcome }}" == "failure" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action needed:** patches no longer apply to upstream main. Fix with \`bin/kit regenerate --dir <working-tree>\`." >> "$GITHUB_STEP_SUMMARY"
          fi
